<script>
'use strict';
const $=s=>document.querySelector(s),sauces=['tomato','cream','pesto'],toppings=['bacon','mushroom','shrimp'];
const names={raw:'生直麵',noodle:'熟麵',tomato:'番茄醬',cream:'奶油白醬',pesto:'青醬',bacon:'培根',mushroom:'蘑菇',shrimp:'蝦仁'};
function dishName(order){return ({tomato:'番茄',cream:'奶油',pesto:'青醬'}[order.sauce])+(order.topping?names[order.topping]:'')+'義大利麵'}
function icon(type,color){
if(type==='person'){
const index=color==='#63816d'?0:color==='#bc6745'?1:2;
return '<svg viewBox="0 0 724 724" aria-hidden="true"><defs><clipPath id="portrait-clip-'+index+'"><rect width="724" height="724"/></clipPath></defs><g clip-path="url(#portrait-clip-'+index+')"><use href="#customer-art" transform="translate('+(-index*724)+' 0)"/></g></svg>';
}
// 未放麵時只疊上醬汁，不使用已包含麵條的成品圖。
if(type.startsWith('sauce-only-')){
const kind=type.slice(11),[x,y,w,h]=({tomato:[360,95,235,110],cream:[674,95,222,110],pesto:[991,95,223,110]})[kind];
return '<svg viewBox="0 0 240 110" preserveAspectRatio="none" aria-hidden="true"><defs><clipPath id="sauce-clip-'+kind+'"><ellipse cx="120" cy="55" rx="110" ry="44"/></clipPath></defs><g clip-path="url(#sauce-clip-'+kind+')"><use href="#kitchen-art" transform="scale('+(240/w)+' '+(110/h)+') translate('+(-x)+' '+(-y)+') scale(0.78375)"/></g></svg>';
}
let slot=({raw:0,bacon:4,mushroom:5,shrimp:6,noodle:9,plate:13})[type];
if(['tomato','cream','pesto'].includes(type))slot=({tomato:color==='ingredient'?1:10,cream:color==='ingredient'?2:11,pesto:color==='ingredient'?3:12})[type];
if(type==='pot')slot=color?8:7;
// 依實際插畫邊界裁切，避免手繪物件略跨格時切到鄰近素材。
const crops=[[0,0,318,320],[335,45,280,265],[650,45,280,265],[965,45,285,265],[0,333,315,300],[325,345,300,280],[638,337,300,290],[923,344,331,265],[0,640,324,260],[314,658,314,244],[634,655,313,245],[948,655,306,245],[0,950,326,240],[324,951,321,238]];
const [x,y,w,h]=crops[slot],scale=400/Math.max(w,h),offsetX=(400-w*scale)/2,offsetY=(400-h*scale)/2,food=['noodle','plate','tomato','cream','pesto'].includes(type)&&color!=='ingredient';
// 手繪物件跨格，矩形裁切外再依輪廓清除角落的鄰格殘片。
const bottom=offsetY+h*scale;
const contour={
6:'M0 '+offsetY+'H340L400 175V'+bottom+'H0Z',
7:'M0 '+offsetY+'H400V'+bottom+'H55L45 215L0 190Z',
8:'M0 '+offsetY+'H400V190L355 215V'+bottom+'H0Z',
9:'M0 175L75 '+offsetY+'H400V'+bottom+'H0Z',
12:'M0 '+offsetY+'H400V200L345 '+bottom+'H0Z',
13:'M0 '+offsetY+'H400V270L330 '+bottom+'H0Z'
}[slot];
const cropShape=contour?'<path d="'+contour+'"/>':'<rect x="'+offsetX+'" y="'+offsetY+'" width="'+(w*scale)+'" height="'+(h*scale)+'"/>';
let drawing='<defs><clipPath id="object-clip-'+slot+'">'+cropShape+'</clipPath></defs><g clip-path="url(#object-clip-'+slot+')"><use href="#kitchen-art" transform="translate('+offsetX+' '+offsetY+') scale('+scale+') translate('+(-x)+' '+(-y)+') scale(0.78375)"/></g>';
// 在同一個鍋具座標中疊加水泡與蒸氣，維持縮放時的位置一致。
if(type==='pot'&&color)drawing+='<g fill="#fff8db"><circle class="boil-bubble" cx="165" cy="153" r="8"/><circle class="boil-bubble second" cx="210" cy="145" r="9"/><circle class="boil-bubble third" cx="246" cy="158" r="7"/></g><g class="vapour" transform="translate(140 30) scale(2)"><path d="M10 35q-7-9-1-17t-1-12"/><path d="M30 31q7-8 1-16t1-12"/><path d="M51 35q-6-9-1-17t-1-12"/></g>';
return '<svg viewBox="'+(food?'0 45 400 310':'0 0 400 400')+'" preserveAspectRatio="'+(food?'none':'xMidYMid meet')+'" aria-hidden="true">'+drawing+'</svg>';
}
let game={phase:'ready',elapsed:0,last:0,score:0,count:0,pots:[null,null,null],orders:[],plates:[],feedback:[null,null,null]},best=0,selected=null,drag=null,toastUntil=0;
try{best=Number(localStorage.getItem('pasta-best'))||0}catch(e){}
const emptyPlate=()=>({noodle:null,sauce:null,topping:null});
const newOrder=()=>({sauce:sauces[Math.floor(Math.random()*3)],topping:Math.random()<.4?null:toppings[Math.floor(Math.random()*3)]});
function cookScore(s){return s<2?10:s<4?25:s<=7?40:s<=10?25:10}
function quality(s){return s<4?'未熟':s<=7?'剛好':'過熟'}
function scoreDish(p,o){return {noodle:cookScore(p.noodle),sauce:p.sauce===o.sauce?40:0,topping:p.topping===o.topping?20:0}}
function toast(t){$('#toast').textContent=t;toastUntil=performance.now()+2100}
function modal(html){$('#modal').innerHTML=html;$('#overlay').hidden=false;document.querySelector('main').inert=true;document.querySelector('header').inert=true;requestAnimationFrame(()=>$('#modal button')?.focus())}
function closeModal(){$('#overlay').hidden=true;document.querySelector('main').inert=false;document.querySelector('header').inert=false}
function intro(){modal('<div class="pill">BENVENUTI · 歡迎來到小廚房</div><div class="hero">'+icon('tomato')+'</div><h2 id="modal-title">好吃的義大利麵</h2><p>繫上圍裙，為三位客人端出好味道。<br>120 秒，你能完成幾份美味？</p><div class="steps">① 拖生麵入鍋，4–7 秒撈起最剛好。<br>② 把麵、醬料和配料放到客人的餐盤。<br>③ 點「出餐」得分，同時照顧另外兩口鍋！<br>也支援點選食材，再點鍋子或餐盤。</div><button class="primary" id="start">開始營業 →</button><p>本機最高分：'+best+'</p>');$('#start').onclick=start}
function start(){game={phase:'playing',elapsed:0,last:performance.now(),score:0,count:0,pots:[null,null,null],orders:Array.from({length:3},newOrder),plates:Array.from({length:3},emptyPlate),feedback:[null,null,null]};selected=null;cancelDrag();closeModal();render();$('#pause').focus()}
function render(){renderOrders();renderPots();renderRack();hud()}
function renderOrders(){$('#orders').innerHTML=game.orders.map((o,i)=>{const p=game.plates[i],f=game.feedback[i];return '<article class="order"><div class="customer">'+icon('person',['#63816d','#bc6745','#8580a0'][i])+'</div><div class="ticket">'+dishName(o)+'</div><div class="plate" data-drop="plate" data-index="'+i+'" tabindex="0" role="button" aria-label="餐盤 '+(i+1)+'"><div class="dish '+(p.noodle===null&&!p.sauce&&!p.topping?'empty':'')+'">'+(p.noodle!==null?icon(p.sauce||'noodle'):icon('plate'))+(p.noodle===null&&p.sauce?'<span class="sauce-layer">'+icon('sauce-only-'+p.sauce)+'</span>':'')+(p.topping?'<span class="topping">'+icon(p.topping)+'</span>':'')+'</div></div><div class="contents">'+(p.noodle!==null?quality(p.noodle)+'麵':'尚未放麵')+' · '+(names[p.sauce]||'無醬')+' · '+(names[p.topping]||'無配料')+'</div><div class="actions"><button data-action="plate-clear" data-index="'+i+'">清空餐盤</button><button class="primary" data-action="serve" data-index="'+i+'" '+(p.noodle===null||f?'disabled':'')+'>出餐 →</button></div>'+(f?'<div class="feedback" role="status"><small>客人收到料理了！</small><strong>＋'+f.total+'</strong><p>熟度 '+f.noodle+' / 40<br>醬料 '+f.sauce+' / 40　配料 '+f.topping+' / 20</p><b>'+(f.total===100?'完美！好吃的義大利麵！':'下一份，再更美味一點！')+'</b></div>':'')+'</article>'}).join('')}
function renderPots(){$('#pots').innerHTML=game.pots.map((p,i)=>'<div class="pot-slot"><div class="pot" data-drop="pot" data-index="'+i+'" '+(p!==null?'data-source="noodle"':'')+' tabindex="0" role="button" aria-label="鍋子 '+(i+1)+'">'+icon('pot',p!==null?'#efcf68':null)+'</div><div class="bar"><i id="bar'+i+'"></i></div><div class="pot-label"><button data-action="pot-clear" data-index="'+i+'">清空</button></div></div>').join('');updatePots()}
function renderRack(){$('#rack').innerHTML=['raw',...sauces,...toppings].map(t=>'<button class="ingredient" data-source="'+t+'" aria-label="選取'+names[t]+'">'+icon(t,'ingredient')+names[t]+'</button>').join('')}
function updatePots(){game.pots.forEach((p,i)=>{const s=p===null?0:(game.elapsed-p)/1000;$('#bar'+i).style.width=Math.min(s/12*100,100)+'%';$('#bar'+i).style.background=s<4?'#d6a23c':s<=7?'#648448':'#ba5840'})}
function hud(){const left=Math.max(0,Math.ceil((120000-game.elapsed)/1000));$('#time').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');$('#score').textContent=game.score;$('#count').textContent=game.count;$('#pause').disabled=game.phase!=='playing'}
// 共用可暫停的時間軸，避免背景分頁節流導致鍋子與營業倒數不同步。
function sync(now=performance.now()){if(game.phase!=='playing')return;game.elapsed=Math.min(120000,game.elapsed+Math.max(0,now-game.last));game.last=now;if(game.elapsed>=120000)finish()}
function allowed(source,target){if(!target)return false;const i=Number(target.dataset.index);return target.dataset.drop==='pot'?source.type==='raw'&&game.pots[i]===null:!game.feedback[i]&&source.type!=='raw'&&(source.type!=='noodle'||game.plates[i].noodle===null)}
function drop(source,target){sync();if(game.phase!=='playing')return;if(!allowed(source,target)){toast('這裡放不下，換個位置試試！');return}const i=Number(target.dataset.index);if(target.dataset.drop==='pot')game.pots[i]=game.elapsed;else{const p=game.plates[i];if(source.type==='noodle'){if(game.pots[source.index]===null){toast('這口鍋已經空了');return}p.noodle=(game.elapsed-game.pots[source.index])/1000;game.pots[source.index]=null}else if(sauces.includes(source.type))p.sauce=source.type;else p.topping=source.type}clearSelection();renderOrders();renderPots()}
function cancelDrag(){document.querySelectorAll('.picked,.valid,.over').forEach(e=>e.classList.remove('picked','valid','over'));$('#ghost')?.remove();drag=null}
function clearSelection(){selected=null;$('#toast').textContent='';document.querySelectorAll('.picked,.valid,.over').forEach(e=>e.classList.remove('picked','valid','over'))}
function choose(source){selected=source;document.querySelectorAll('.picked,.valid').forEach(el=>el.classList.remove('picked','valid'));document.querySelectorAll('[data-source]').forEach(el=>{if(el.dataset.source===source.type&&(source.type!=='noodle'||Number(el.dataset.index)===source.index))el.classList.add('picked')});document.querySelectorAll('[data-drop]').forEach(el=>{if(allowed(source,el))el.classList.add('valid')});toast('已選取'+(source.type==='noodle'?'鍋中麵條':names[source.type])+'，請點選亮起的位置')}
document.addEventListener('pointerdown',e=>{if(game.phase!=='playing'||e.button!==0)return;const el=e.target.closest('[data-source]');if(!el)return;sync();if(game.phase!=='playing')return;const source={type:el.dataset.source,index:Number(el.dataset.index)};drag={source,x:e.clientX,y:e.clientY,moved:false,id:e.pointerId};document.querySelectorAll('[data-drop]').forEach(t=>{if(allowed(source,t))t.classList.add('valid')});e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>5)drag.moved=true;if(!drag.moved)return;e.preventDefault();let ghost=$('#ghost');if(!ghost){ghost=document.createElement('div');ghost.id='ghost';ghost.innerHTML=icon(drag.source.type);document.body.append(ghost)}ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';document.querySelectorAll('.over').forEach(t=>t.classList.remove('over'));const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop]');if(allowed(drag.source,target))target.classList.add('over')},{passive:false});
let suppressClick=0;
document.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const d=drag,target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop]');cancelDrag();suppressClick=d.moved?performance.now()+300:0;if(d.moved)drop(d.source,target);else choose(d.source)});
document.addEventListener('pointercancel',cancelDrag);
document.addEventListener('click',e=>{const action=e.target.closest('[data-action]');if(action){sync();if(game.phase!=='playing')return;const i=Number(action.dataset.index);if(game.feedback[i]&&action.dataset.action!=='pot-clear')return;if(action.dataset.action==='plate-clear')game.plates[i]=emptyPlate();if(action.dataset.action==='pot-clear')game.pots[i]=null;if(action.dataset.action==='serve'){const p=game.plates[i];if(p.noodle===null)return;const parts=scoreDish(p,game.orders[i]);const total=parts.noodle+parts.sauce+parts.topping;game.score+=total;game.count++;game.feedback[i]={...parts,total,until:game.elapsed+1500};game.plates[i]=emptyPlate()}clearSelection();renderOrders();renderPots();hud();return}if(performance.now()<suppressClick||game.phase!=='playing')return;const source=e.target.closest('[data-source]'),target=e.target.closest('[data-drop]');if(source){choose({type:source.dataset.source,index:Number(source.dataset.index)});return}if(target&&selected)drop(selected,target)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){selected=null;cancelDrag()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-drop]')){e.preventDefault();e.target.click()}});
function pause(){sync();if(game.phase!=='playing')return;game.phase='paused';cancelDrag();selected=null;modal('<div class="pill">TAKE A LITTLE BREAK</div><h2 id="modal-title">廚房休息中</h2><p>營業倒數和三口鍋都已暫停。<br>準備好再繼續料理吧！</p><button class="primary" id="resume">繼續營業 →</button>');$('#resume').onclick=()=>{game.last=performance.now();game.phase='playing';closeModal();$('#pause').focus()};hud()}
$('#pause').onclick=pause;document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
function finish(){game.phase='ended';cancelDrag();selected=null;best=Math.max(best,game.score);try{localStorage.setItem('pasta-best',String(best))}catch(e){}hud();modal('<div class="pill">GRAZIE MILLE</div><h2 id="modal-title">今天也辛苦了！</h2><div class="result-score">'+game.score+'<small style="font-size:17px"> 分</small></div><div class="result-grid"><div><b>'+game.count+'</b><small>完成出餐</small></div><div><b>'+(game.count?Math.round(game.score/game.count):0)+'</b><small>平均得分</small></div><div><b>'+best+'</b><small>本機最高分</small></div></div><p>下一次，把握 4–7 秒的黃金熟度，<br>也別忘了看看客人要不要配料！</p><button class="primary" id="restart">再玩一次 →</button>');$('#restart').onclick=start}
function tick(now){sync(now);if(game.phase==='playing'){let changed=false;game.feedback.forEach((f,i)=>{if(f&&game.elapsed>=f.until){game.feedback[i]=null;game.orders[i]=newOrder();changed=true}});if(changed)renderOrders();updatePots();hud()}if(now>toastUntil)$('#toast').textContent='';requestAnimationFrame(tick)}
game.orders=Array.from({length:3},newOrder);game.plates=Array.from({length:3},emptyPlate);render();intro();requestAnimationFrame(tick);
</script></body></html>
